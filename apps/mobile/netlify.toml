# =============================================================================
# Netlify Configuration for Web Application B (apps/mobile - Expo Web)
# =============================================================================
# Development Port: 8081
# Production Build Output: apps/mobile/dist
# =============================================================================

[build]
  base = "apps/mobile"
  command = "pnpm --filter @luggage-storage/mobile export"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA Routing Fallback for Expo Router Web Navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
