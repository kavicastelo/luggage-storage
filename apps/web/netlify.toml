# =============================================================================
# Netlify Configuration for Web Application A (apps/web)
# =============================================================================
# Development Port: 5173
# Production Build Output: apps/web/dist
# =============================================================================

[build]
  base = "apps/web"
  command = "pnpm --filter @luggage-storage/web build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA Routing Fallback (Prevents 404 on refresh and deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
