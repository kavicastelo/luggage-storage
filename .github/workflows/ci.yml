name: CI Pipeline

on:
  push:
    branches: [ main, dev, develop, feat/phase-1b-identity, 'feat/**', 'feature/**' ]
  pull_request:
    branches: [ main, dev, develop, feat/phase-1b-identity, 'feat/**', 'feature/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build (Full Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start PostgreSQL/PostGIS database
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @luggage-storage/contracts build

      - name: Apply PostgreSQL database migrations and verify schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://luggage_user:luggage_password@127.0.0.1:5432/luggage_storage_dev
          MIGRATION_DATABASE_URL: postgresql://luggage_migrator:migrator_password@127.0.0.1:5432/luggage_storage_dev
          NODE_ENV: test
          DB_IDENTITY_SECRET: ${{ secrets.DB_IDENTITY_SECRET || 'ci_test_identity_secret_key_minimum_32_characters_random' }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY || 'ci_test_payout_encryption_key_32_chars_random' }}
          CUSTODY_TOKEN_HMAC_SECRET: ${{ secrets.CUSTODY_TOKEN_HMAC_SECRET || 'ci_test_custody_token_hmac_secret_minimum_32_chars_random' }}

      - name: Execute Full Quality Gate (pnpm verify)
        run: pnpm verify
        env:
          DATABASE_URL: postgresql://luggage_user:luggage_password@127.0.0.1:5432/luggage_storage_dev
          MIGRATION_DATABASE_URL: postgresql://luggage_migrator:migrator_password@127.0.0.1:5432/luggage_storage_dev
          NODE_ENV: test
          DB_IDENTITY_SECRET: ${{ secrets.DB_IDENTITY_SECRET || 'ci_test_identity_secret_key_minimum_32_characters_random' }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY || 'ci_test_payout_encryption_key_32_chars_random' }}
          CUSTODY_TOKEN_HMAC_SECRET: ${{ secrets.CUSTODY_TOKEN_HMAC_SECRET || 'ci_test_custody_token_hmac_secret_minimum_32_chars_random' }}

      - name: Stop PostgreSQL/PostGIS database
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v

  security-audit:
    name: Dependency Vulnerability & Lockfile Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check critical vulnerabilities (blocking)
        run: pnpm audit --audit-level=critical

      - name: Report high/moderate advisories (non-blocking)
        continue-on-error: true
        run: pnpm audit --audit-level=high

  browser-e2e:
    name: Playwright Browser E2E Suite
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start PostgreSQL/PostGIS database
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d --wait

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @luggage-storage/contracts build

      - name: Apply PostgreSQL database migrations and verify schema
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://luggage_user:luggage_password@127.0.0.1:5432/luggage_storage_dev
          MIGRATION_DATABASE_URL: postgresql://luggage_migrator:migrator_password@127.0.0.1:5432/luggage_storage_dev
          NODE_ENV: test
          DB_IDENTITY_SECRET: ${{ secrets.DB_IDENTITY_SECRET || 'ci_test_identity_secret_key_minimum_32_characters_random' }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY || 'ci_test_payout_encryption_key_32_chars_random' }}
          CUSTODY_TOKEN_HMAC_SECRET: ${{ secrets.CUSTODY_TOKEN_HMAC_SECRET || 'ci_test_custody_token_hmac_secret_minimum_32_chars_random' }}

      - name: Install Playwright Chromium
        run: pnpm --filter @luggage-storage/web exec playwright install --with-deps chromium

      - name: Execute Browser E2E Journeys
        run: pnpm --filter @luggage-storage/web test:e2e
        env:
          DATABASE_URL: postgresql://luggage_user:luggage_password@127.0.0.1:5432/luggage_storage_dev
          MIGRATION_DATABASE_URL: postgresql://luggage_migrator:migrator_password@127.0.0.1:5432/luggage_storage_dev
          NODE_ENV: test
          PAYMENT_PROVIDER: sandbox
          RATE_LIMIT_LOGIN_IP_MAX: "1000"
          DB_IDENTITY_SECRET: ${{ secrets.DB_IDENTITY_SECRET || 'ci_test_identity_secret_key_minimum_32_characters_random' }}
          PAYOUT_ENCRYPTION_KEY: ${{ secrets.PAYOUT_ENCRYPTION_KEY || 'ci_test_payout_encryption_key_32_chars_random' }}
          CUSTODY_TOKEN_HMAC_SECRET: ${{ secrets.CUSTODY_TOKEN_HMAC_SECRET || 'ci_test_custody_token_hmac_secret_minimum_32_chars_random' }}

      - name: Upload Playwright Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

      - name: Stop PostgreSQL/PostGIS database
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down -v
